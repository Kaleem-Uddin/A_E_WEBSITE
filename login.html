<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - IT Support Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <!-- Company Logo -->
            <div class="login-logo">
                <img src="IMAGES/advance_est.png" alt="Company Logo">
            </div>

            <h1>IT Support Portal</h1>

            <p class="login-subtitle">
                Login to continue
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email / Employee ID
                    </label>

                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your email or employee ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Type -->

                <div class="login-type">

                    <label>
                        Login As
                    </label>

                    <div class="login-type-options">

                        <label>
                            <input
                                type="radio"
                                name="loginType"
                                value="employee"
                                checked
                            >
                            Employee
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="loginType"
                                value="it"
                            >
                            IT Team
                        </label>

                    </div>

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-submit">
                    Login
                </button>

            </form>


            <!-- Back to Home -->

            <a
                href="index.html"
                class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
